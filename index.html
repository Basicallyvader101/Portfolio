<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erin Hansen</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/f319e0ec56.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="landing-page" onmousemove="moveBackground(event)">
        <nav>
            <figure>
                <img id="personal-logo"src="./assets/logo.svg" alt="">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link" onclick="toggleModal()">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black">About</a>
                </li>
                <li class="nav__link">
                    <a href="#projects" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black">Projects</a>
                </li>
                <li class="nav__link" onclick="toggleModal()">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black">Contact</a>
                </li>
                <li class="nav__link--click" onclick="toggleContrast()">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect
                    link__hover-effect--black">
                <i class="fas fa-adjust"></i>
                </a>
                </li>
            </ul>
        </nav>
        <header class="header">
            <div class="header__content">
            <h1 class="title">Hello</h1>
            <h1 class="title orange">I'm Erin.</h1>
            <p class="header__para">I'm a <b class="orange">Frontend Software Engineer</b> with a strong passion for building web applications with great user experiences.<br>Here's a bit more <b class="orange click" onclick="toggleModal()">about me</b>.</p>
            <div class="social__list">
                <a href="https://www.linkedin.com/in/erin-hansen-a815013a0/?trk=opento_sprofile_topcard" target="_blank" class="social__link-click">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
                <a href="https://github.com/Basicallyvader101" target="_blank" class="social__link-click">
                    <i class="fa-brands fa-github"></i>
                </a>
                </div>
            </div>
        </header>
    </section>
</body>
</html>
